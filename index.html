<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইকোনমিক্স স্মার্ট স্টোর (Economics Store)</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #27ae60;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* ১. সুন্দর ব্যানার / হিরো সেকশন */
        .hero-banner {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 1rem;
        }

        .hero-banner h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero-banner p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--primary-color);
            margin: 2.5rem 0 1.5rem 0;
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 60px;
            height: 3px;
            background: var(--secondary-color);
            display: block;
            margin: 0.5rem auto 0 auto;
            border-radius: 2px;
        }

        /* ২ & ৩. বড় প্রোডাক্ট কার্ড (১ কেজির বস্তা) */
        .big-product-card {
            background: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .big-product-card img {
            width: 100%;
            max-width: 450px;
            height: 300px;
            object-fit: cover;
        }

        .big-product-details {
            padding: 2rem;
            flex: 1;
            min-width: 280px;
        }

        .big-product-details h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: var(--secondary-color);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .price-tag {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #219653;
            transform: translateY(-2px);
        }

        /* ৪. ছোট প্যাকেজ স্লাইডার (২, ৩, ৪ কেজি) */
        .slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin: 1.5rem 0 3rem 0;
        }

        .small-packages-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 1rem 0.5rem;
            width: 100%;
            scrollbar-width: none;
        }

        .small-packages-container::-webkit-scrollbar {
            display: none;
        }

        .small-card {
            flex: 0 0 220px;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border: 1px solid #edf2f7;
            transition: transform 0.3s;
        }

        .small-card:hover {
            transform: translateY(-5px);
        }

        .small-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 0.8rem;
        }

        .small-card h4 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 0.3rem;
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            position: absolute;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .prev-btn { left: -15px; }
        .next-btn { right: -15px; }

        /* ৫. অন্যান্য প্রোডাক্টস সেকশন (গ্রিড) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 3rem;
        }

        .product-grid-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #edf2f7;
            text-align: center;
            padding-bottom: 1.2rem;
        }

        .product-grid-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-grid-card h3 {
            font-size: 1.3rem;
            color: var(--primary-color);
            margin: 0.8rem 0 0.3rem 0;
        }

        /* ৬. অর্ডার ও যোগাযোগের তথ্য সেকশন */
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        @media (max-width: 768px) {
            .checkout-container { grid-template-columns: 1fr; }
            .big-product-card { flex-direction: column; }
            .big-product-card img { max-width: 100%; }
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
        }

        .contact-box h3 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 4rem;
        }
    </style>
</head>
